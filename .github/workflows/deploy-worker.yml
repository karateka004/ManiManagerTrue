# Деплой Cloudflare Worker кнопкой из GitHub.
#
# Зачем: выкатывать воркер иначе можно только с компьютера (`npx wrangler deploy`),
# а бывает нужно с телефона. Здесь тот же самый деплой, только запускается из
# вкладки Actions.
#
# Что нужно один раз задать в Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN  — токен из dash.cloudflare.com → My Profile → API Tokens,
#                           шаблон «Edit Cloudflare Workers» (даёт права на скрипты и KV).
#   CLOUDFLARE_ACCOUNT_ID — нужен, только если у токена доступ больше чем к одному
#                           аккаунту. ID виден в адресе панели Cloudflare.
#
# Секреты самого воркера (BOT_TOKEN, ADMIN_KEY) деплой НЕ трогает — они живут в
# Cloudflare и переживают выкат.
name: Деплой воркера

on:
  workflow_dispatch:
  push:
    branches: [main, claude/heatmap-categories-feature-o3yboc]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

# Два деплоя одновременно устроят гонку за одну и ту же версию скрипта.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Установить зависимости
        working-directory: worker
        run: npm ci

      - name: Проверка типов
        working-directory: worker
        run: npx tsc --noEmit -p tsconfig.json

      # Без токена деплоить нечем. Валить сборку красным не за что — это не
      # поломка кода, поэтому просто предупреждаем и выходим.
      - name: Проверить токен
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрет CLOUDFLARE_API_TOKEN не задан — деплой пропущен. Добавьте его в Settings → Secrets and variables → Actions и перезапустите этот прогон."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Выкатить воркер
        if: steps.token.outputs.has == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Проверить, что воркер отвечает
        if: steps.token.outputs.has == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://koshel-worker.karateka004.workers.dev/health)
          echo "GET /health → $code"
          test "$code" = "200"
