<!doctype html>
<!-- class="dark": тёмная — тема по умолчанию (2.8), первый кадр до скрипта уже тёмный;
     светлую по выбору ставит applyInitialAppearance в main.tsx до первой отрисовки. -->
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP под текущий стек. GitHub Pages не отдаёт HTTP-заголовки, поэтому CSP в meta.
      style 'unsafe-inline' обязателен: framer-motion и темы (useAccent) пишут inline-стили.
      frame-ancestors в meta игнорируется (и приложение живёт в webview Telegram) — не добавляем.
      clarity.ms — записи сессий (src/lib/clarity.ts): загрузчик www, скрипт scripts, отправка
      на поддомен под регион проекта (v., k., y.…) — потому *.clarity.ms в connect-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://telegram.org https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://koshel-worker.karateka004.workers.dev https://*.clarity.ms; base-uri 'self'; object-src 'none'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0E0F0E" />
    <title>Кошель — финансы</title>
    <!-- Соединение с воркером — заранее: облако и записи бота запрашиваются сразу после старта. -->
    <link rel="preconnect" href="https://koshel-worker.karateka004.workers.dev" crossorigin />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" crossorigin src="./assets/index-N53o_mFi.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor-DT-BE-qO.js">
    <link rel="modulepreload" crossorigin href="./assets/react-BX2NPOWi.js">
    <link rel="stylesheet" crossorigin href="./assets/index-Bv6yGUtX.css">
    <link rel="preload" as="font" type="font/woff2" href="./assets/manrope-cyrillic-wght-normal-Dvxsihut.woff2" crossorigin="" fetchpriority="low">
    <link rel="preload" as="font" type="font/woff2" href="./assets/manrope-latin-wght-normal-DHIcAJRg.woff2" crossorigin="" fetchpriority="low">
  </head>
  <!-- Записи Clarity скрывают всю страницу; открыт только неизменный интерфейс (UNMASK в src/lib/clarity.ts). -->
  <body data-clarity-mask="true">
    <div id="root"></div>
  </body>
</html>
